faq:
  title: "A few questions"
  description: "Short answers. More on the services pages if you need depth."
  categories:
    - title: Working together
      questions:
        - label: What are you looking for right now?
          content: |
            Teams who need someone to design and ship — products that have to work at the edge, messy legacy, or AI with real controls. Not endless decks.
        - label: How do engagements usually start?
          content: |
            A short scoping note or call. We align on the problem, constraints, and a bounded next step. Email [hello@zafar.dev](mailto:hello@zafar.dev).
        - label: Where can I read more about services?
          content: |
            [AI systems](/services/ai-systems) and [Product craft](/services/product-craft) — those pages carry the depth. Home stays personal.
