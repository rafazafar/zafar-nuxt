faq:
  title: Frequently Asked Questions
  description: Straight answers about how engagements work.
  categories:
    - title: General
      questions:
        - label: What do you offer?
          content: |
            One-stop digital factory — AI systems with real production controls (gates, allowlists, audit trails) + product craft (UI, interaction, shippable design). See [AI systems](/services/ai-systems) and [Product craft](/services/product-craft).
        - label: How do you work?
          content: |
            Collaborative, iterative, ego-free, ship in slices. AI: controls from sprint one. Craft: iterate in product, not endless decks.
        - label: Do you work with startups?
          content: |
            Yes. Focused slices can move in weeks when scope is honest. Enterprise AI control work scoped separately — no "1–2 week MVP" for production AI with real guards.
        - label: Only AI or only design?
          content: |
            Both. Same factory.
        - label: How do I start?
          content: |
            [Book a scoping call](https://cal.com/zafar) or email [hello@zafar.dev](mailto:hello@zafar.dev). First call: use case, constraints, out of scope, bounded next step.
