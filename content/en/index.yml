about:
  title: "About Me"
  description: |
    I'm in love with creating useful and impactful products that bring people together. Experienced in multiple industries designing, simplifying, building and scaling solutions for startups and the enterprise. Using first-principle thinking.

    My approach is simple: Iterate fast, iterate often, and don't stop iterating. And never say no, just dwell on it for a good moment.
